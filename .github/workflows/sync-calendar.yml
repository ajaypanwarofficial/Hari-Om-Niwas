name: Sync OTA Calendars

on:
  schedule:
    # Backup only. GitHub runs scheduled jobs late and unevenly (every 2-5
    # hours in practice). The on-time trigger is the Cloudflare Worker in
    # cloudflare-worker/sync-timer.js, which starts a run every 15 minutes
    # through workflow_dispatch below.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      token_expires:
        # Filled in by the Cloudflare Worker: when its GitHub token expires,
        # so the dashboard can warn a week ahead.
        description: 'Expiry of the Worker GitHub token'
        required: false
        default: ''

permissions:
  contents: write

# A manual refresh and a scheduled run must never push at the same time.
concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A hung run must not block the runs behind it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The latest main, not the commit the run was started from. Two runs
          # started seconds apart (dashboard + timer) otherwise both commit the
          # same change and the second fails on the push.
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch and merge calendars
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          INGO_ICAL_URL: ${{ secrets.INGO_ICAL_URL }}
          AGODA_ICAL_URL: ${{ secrets.AGODA_ICAL_URL }}
          TOKEN_EXPIRES: ${{ inputs.token_expires }}
        run: node scripts/sync.js

      - name: Commit only if bookings changed
        run: |
          git config user.name "hon-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dashboard/calendar.json docs/dashboard/merged.ics docs/dashboard/feed-for-*.ics
          if git diff --cached --quiet; then
            echo "No booking changes. Nothing to commit."
            exit 0
          fi
          git commit -m "Sync calendars $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A site deploy may have landed while this ran; rebase onto it before pushing.
          git pull --rebase origin main
          git push
