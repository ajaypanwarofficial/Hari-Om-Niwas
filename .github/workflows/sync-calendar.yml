name: Sync OTA Calendars

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and merge calendars
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          INGO_ICAL_URL: ${{ secrets.INGO_ICAL_URL }}
        run: node scripts/sync.js

      - name: Commit updated calendar data
        run: |
          git config user.name "hon-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dashboard/calendar.json docs/dashboard/merged.ics
          git diff --cached --quiet || git commit -m "Sync calendars $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push