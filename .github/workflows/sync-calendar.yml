name: Sync OTA Calendars

on:
  schedule:
    # GitHub runs scheduled jobs late and unevenly — in practice this fires
    # every 2-4 hours, not every 15 minutes. That is normal, not a fault.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# A manual refresh and a scheduled run must never push at the same time.
concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A hung run must not block the runs behind it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch and merge calendars
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          INGO_ICAL_URL: ${{ secrets.INGO_ICAL_URL }}
        run: node scripts/sync.js

      - name: Commit only if bookings changed
        run: |
          git config user.name "hon-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dashboard/calendar.json docs/dashboard/merged.ics docs/dashboard/feed-for-*.ics
          if git diff --cached --quiet; then
            echo "No booking changes. Nothing to commit."
            exit 0
          fi
          git commit -m "Sync calendars $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A site deploy may have landed while this ran; rebase onto it before pushing.
          git pull --rebase origin main
          git push
