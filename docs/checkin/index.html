<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in — Hari Om Niwas</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F3EDE0; --ink: #3B2E22; --terra: #B85C38; --sand: #D9C9AC; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); }
  header { padding: 20px 24px 8px; }
  .arch-mark {
    width: 22px; height: 27px; border: 1.4px solid var(--sand);
    border-top-left-radius: 999px; border-top-right-radius: 999px; border-bottom: none; margin-bottom: 10px;
  }
  h1 {
    font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: .01em;
    font-size: 26px; margin: 0; color: var(--ink);
  }
  h1 span { color: var(--terra); }
  iframe {
    width: 100%; height: calc(100vh - 90px); border: none; display: block;
  }
</style>
</head>
<body>
<header>
  <div class="arch-mark"></div>
  <h1>Check-in<span>.</span></h1>
</header>
<iframe src="https://tally.so/r/Me0LjX" title="Hari Om Niwas guest check-in"></iframe>
</body>
</html>
