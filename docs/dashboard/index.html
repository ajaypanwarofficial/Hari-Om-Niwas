<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hari Om Niwas — Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3EDE0; --ink: #3B2E22; --terra: #B85C38;
    --olive: #6B6B44; --sand: #D9C9AC; --teak: #5C3A28; --faint: #8B7D68;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Spectral', serif; }

  #gate {
    position: fixed; inset: 0; background: var(--paper); z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  }
  #gate input {
    font-family: 'Work Sans', sans-serif; font-size: 20px; letter-spacing: .3em;
    text-align: center; width: 200px; padding: 12px; border: 1.5px solid var(--sand);
    border-radius: 2px; background: white; color: var(--ink);
  }
  #gate input:focus { outline: none; border-color: var(--terra); }
  #gate button {
    font-family: 'Work Sans', sans-serif; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    background: var(--terra); color: var(--paper); border: none; padding: 12px 28px; border-radius: 2px; cursor: pointer;
  }
  #gate .err { color: var(--terra); font-family: 'Work Sans', sans-serif; font-size: 12px; min-height: 16px; }
  #app { display: none; }

  main { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }

  .arch-mark {
    width: 26px; height: 32px; border: 1.6px solid var(--sand);
    border-top-left-radius: 999px; border-top-right-radius: 999px; border-bottom: none; margin-bottom: 24px;
  }

  h1 {
    font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: .01em;
    line-height: 1; font-size: 30px; margin: 0 0 4px; color: var(--teak);
  }
  h1 .full-stop { color: var(--terra); }

  .status-line {
    font-family: 'Work Sans', sans-serif; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 20px;
  }
  .status-line strong { color: var(--ink); font-weight: 500; }

  .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }

  .month-nav { display: flex; align-items: center; gap: 14px; }
  .month-nav button {
    background: none; border: 1.4px solid var(--sand); color: var(--ink); width: 32px; height: 32px;
    border-radius: 2px; cursor: pointer; font-size: 16px; line-height: 1;
  }
  .month-nav button:hover { border-color: var(--terra); color: var(--terra); }
  .month-title { font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: 20px; min-width: 200px; text-align: center; }


  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; font-family: 'Work Sans', sans-serif; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--sand); border: 1px solid var(--sand); }
  .dow { background: var(--paper); font-family: 'Work Sans', sans-serif; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--olive); text-align: center; padding: 8px 0; }
  .cell { background: var(--paper); min-height: 74px; padding: 6px; position: relative; cursor: default; }
  .cell.other-month .daynum { opacity: .35; }
  .cell.today .daynum { background: var(--ink); color: var(--paper); border-radius: 50%; }
  .cell.long-weekend { background: #f0e2d4; }
  .daynum { font-family: 'Work Sans', sans-serif; font-size: 12px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .holiday-label { font-family: 'Work Sans', sans-serif; font-size: 8px; color: var(--terra); line-height: 1.2; margin-top: 2px; }
  .holiday-label.provisional { opacity: .7; }
  .tags { display: flex; flex-direction: column; gap: 2px; margin-top: 5px; }
  .tag {
    font-family: 'Work Sans', sans-serif; font-size: 9px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: #fff; padding: 3px 4px; border-radius: 2px; white-space: nowrap; overflow: hidden; line-height: 1.1;
  }
  /* Platform colours on purpose: this is a private tool, and recognising a
     booking at a glance matters more here than the house palette. */
  .tag.airbnb, .swatch.airbnb { background: #FF385C; }
  .tag.booking, .swatch.booking { background: #003B95; }
  .tag.ingo, .swatch.ingo { background: #F26722; }
  .provisional-note { font-family: 'Work Sans', sans-serif; font-size: 11px; color: var(--faint); font-style: italic; margin-top: 10px; }
  @media (max-width: 480px) {
    .cell { padding: 4px 3px; min-height: 64px; }
    .tag { font-size: 8px; letter-spacing: 0; padding: 3px 2px; }
  }

  .upcoming { margin-top: 40px; }
  .upcoming h2 { font-family: 'Work Sans', sans-serif; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--olive); border-bottom: 1.5px solid var(--sand); padding-bottom: 8px; }
  .lw-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dotted var(--sand); font-size: 15px; }
  .lw-row .tag { font-family: 'Work Sans', sans-serif; font-size: 10px; color: var(--faint); text-transform: uppercase; }

  .error { color: var(--terra); font-family: 'Work Sans', sans-serif; font-size: 12px; margin-top: 10px; }
  footer { margin-top: 50px; font-family: 'Work Sans', sans-serif; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
</style>
</head>
<body>

<div id="gate">
  <div class="arch-mark"></div>
  <div style="font-family:'Anton',sans-serif; text-transform:uppercase; font-size:22px; color:var(--teak);">Enter code<span style="color:var(--terra)">.</span></div>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="off">
  <button id="pin-submit">Unlock</button>
  <div class="err" id="pin-err"></div>
</div>

<div id="app">
<main>
  <div class="arch-mark"></div>
  <h1>Calendar<span class="full-stop">.</span></h1>
  <p class="status-line" id="status-line">Loading…</p>

  <div class="controls">
    <div class="month-nav">
      <button id="prev-month">‹</button>
      <div class="month-title" id="month-title"></div>
      <button id="next-month">›</button>
    </div>
  </div>

  <div class="legend">
    <span><i class="swatch airbnb"></i>Airbnb</span>
    <span><i class="swatch booking"></i>Booking.com</span>
    <span><i class="swatch ingo"></i>MMT / Goibibo</span>
    <span><i style="background:#f0e2d4; border:1px solid var(--sand)"></i>Long weekend</span>
  </div>

  <div class="grid" id="grid"></div>
  <p class="provisional-note" id="provisional-note" hidden>2027 holidays are provisional until Rajasthan publishes its official list, usually in December.</p>
  <div id="errors"></div>

  <div class="upcoming">
    <h2>Upcoming long weekends</h2>
    <div id="long-weekends"></div>
  </div>

  <footer>Hari Om Niwas — Jodhpur</footer>
</main>
</div>

<script>
  const PIN = '012345';
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  if (localStorage.getItem('hon_unlocked') === '1') {
    gate.style.display = 'none';
    app.style.display = 'block';
  }
  document.getElementById('pin-submit').onclick = tryUnlock;
  document.getElementById('pin-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
  function tryUnlock() {
    const val = document.getElementById('pin-input').value;
    if (val === PIN) {
      localStorage.setItem('hon_unlocked', '1');
      gate.style.display = 'none';
      app.style.display = 'block';
      init();
    } else {
      document.getElementById('pin-err').textContent = 'Wrong code.';
    }
  }

  const SHORT_LABELS = { airbnb: 'Airbnb', booking: 'Booking', ingo: 'MMT' };
  const SOURCE_LABELS = { airbnb: 'Airbnb', booking: 'Booking.com', ingo: 'MMT / Goibibo' };

  let bookings = [];
  let holidays = [];
  let viewYear, viewMonth;

  function pad(n) { return String(n).padStart(2, '0'); }
  function toKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }

  const RUNS_API = 'https://api.github.com/repos/ajaypanwarofficial/Hari-Om-Niwas/actions/workflows/sync-calendar.yml/runs?per_page=1';

  function fmtStamp(d) {
    return d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  async function loadData() {
    const [calRes, holRes, runRes] = await Promise.all([
      fetch('calendar.json?_=' + Date.now()).then(r => r.json()).catch(() => null),
      fetch('holidays.json?_=' + Date.now()).then(r => r.json()).catch(() => []),
      fetch(RUNS_API).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    holidays = holRes || [];
    const parts = [];
    const lastRun = runRes && runRes.workflow_runs && runRes.workflow_runs[0];
    if (lastRun) {
      const bad = lastRun.conclusion && lastRun.conclusion !== 'success';
      parts.push('Checked <strong>' + fmtStamp(new Date(lastRun.updated_at)) + '</strong>' + (bad ? ' (run ' + lastRun.conclusion + ')' : ''));
    }
    if (calRes) {
      bookings = calRes.bookings || [];
      parts.push('Last change <strong>' + fmtStamp(new Date(calRes.generatedAt)) + '</strong>');
      const failed = (calRes.sources || []).filter((s) => !s.ok);
      document.getElementById('errors').innerHTML = failed.length
        ? '<p class="error">' + failed.map((f) => f.name + ' feed failed (' + f.error + ')' +
            (f.carriedForward ? ' — showing its last known ' + f.carriedForward + ' booking' + (f.carriedForward === 1 ? '' : 's') : '')).join(' · ') + '</p>'
        : '';
    } else {
      parts.push('Could not load booking data');
    }
    document.getElementById('status-line').innerHTML = parts.join(' · ');
  }

  function bookingsOnDate(dateStr) {
    return bookings.filter((b) => dateStr >= b.start.slice(0, 10) && dateStr < b.end.slice(0, 10));
  }

  function holidayOnDate(dateStr) {
    return holidays.find((h) => h.date === dateStr);
  }

  function computeLongWeekends(fromDate, days) {
    const offDays = [];
    for (let i = 0; i < days; i++) {
      const d = new Date(fromDate);
      d.setDate(d.getDate() + i);
      const key = toKey(d.getFullYear(), d.getMonth(), d.getDate());
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const hol = holidayOnDate(key);
      if (isWeekend || hol) offDays.push({ date: new Date(d), key, holiday: hol });
      else offDays.push(null);
    }
    const spans = [];
    let run = [];
    for (const entry of offDays) {
      if (entry) { run.push(entry); }
      else { if (run.length >= 3) spans.push(run); run = []; }
    }
    if (run.length >= 3) spans.push(run);
    return spans;
  }

  function fmt(d) { return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }

  function renderLongWeekends() {
    const today = new Date();
    const endOfNextYear = new Date(today.getFullYear() + 1, 11, 31);
    const spans = computeLongWeekends(today, Math.ceil((endOfNextYear - today) / 86400000) + 1);
    const container = document.getElementById('long-weekends');
    if (!spans.length) {
      container.innerHTML = '<p style="color:var(--faint); font-style:italic;">None found in the coming months.</p>';
      return;
    }
    container.innerHTML = spans.map((s) => {
      const names = s.filter((e) => e.holiday).map((e) => e.holiday.name).join(', ');
      return '<div class="lw-row"><span>' + fmt(s[0].date) + ' – ' + fmt(s[s.length - 1].date) + ' (' + s.length + ' days)</span>' +
        '<span class="tag">' + (names || 'Weekend') + '</span></div>';
    }).join('');
  }

  function renderMonth() {
    document.getElementById('provisional-note').hidden = !holidays.some((h) => h.provisional && h.date.startsWith(String(viewYear)));
    document.getElementById('month-title').textContent =
      new Date(viewYear, viewMonth, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach((d) => {
      const el = document.createElement('div');
      el.className = 'dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(viewYear, viewMonth, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const today = new Date();
    const todayKey = toKey(today.getFullYear(), today.getMonth(), today.getDate());

    const lwKeys = new Set();
    computeLongWeekends(new Date(viewYear, viewMonth, 1), 45).forEach((s) => s.forEach((e) => lwKeys.add(e.key)));

    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement('div');
      let dayNum, cellMonth = viewMonth, isOther = false;
      if (i < startOffset) {
        dayNum = daysInPrevMonth - startOffset + i + 1;
        cellMonth = viewMonth - 1; isOther = true;
      } else if (i >= startOffset + daysInMonth) {
        dayNum = i - startOffset - daysInMonth + 1;
        cellMonth = viewMonth + 1; isOther = true;
      } else {
        dayNum = i - startOffset + 1;
      }
      let normYear = viewYear, normMonth = cellMonth;
      if (normMonth < 0) { normMonth = 11; normYear -= 1; }
      if (normMonth > 11) { normMonth = 0; normYear += 1; }
      const key = toKey(normYear, normMonth, dayNum);

      cell.className = 'cell' + (isOther ? ' other-month' : '') + (key === todayKey ? ' today' : '') + (lwKeys.has(key) ? ' long-weekend' : '');

      const num = document.createElement('div');
      num.className = 'daynum';
      num.textContent = dayNum;
      cell.appendChild(num);

      const hol = holidayOnDate(key);
      if (hol) {
        const label = document.createElement('div');
        label.className = 'holiday-label' + (hol.provisional ? ' provisional' : '');
        label.textContent = hol.name;
        cell.appendChild(label);
      }

      const dayBookings = bookingsOnDate(key);
      if (dayBookings.length) {
        cell.classList.add('booked');
        const tags = document.createElement('div');
        tags.className = 'tags';
        dayBookings.forEach((b) => {
          const tag = document.createElement('div');
          tag.className = 'tag ' + b.source;
          tag.textContent = SHORT_LABELS[b.source] || b.source;
          tags.appendChild(tag);
        });
        cell.appendChild(tags);
      }

      grid.appendChild(cell);
    }
  }

  document.getElementById('prev-month').onclick = () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderMonth();
  };
  document.getElementById('next-month').onclick = () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderMonth();
  };


  async function init() {
    const today = new Date();
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    await loadData();
    renderMonth();
    renderLongWeekends();
  }

  if (gate.style.display === 'none') init();
</script>
</body>
</html>
