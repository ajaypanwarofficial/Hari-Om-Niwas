<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hari Om Niwas — Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3EDE0;
    --ink: #3B2E22;
    --terra: #B85C38;
    --olive: #6B6B44;
    --sand: #D9C9AC;
    --teak: #5C3A28;
    --faint: #8B7D68;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Spectral', serif;
    font-size: 17px;
    line-height: 1.6;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  .arch-mark {
    width: 26px;
    height: 32px;
    border: 1.6px solid var(--sand);
    border-top-left-radius: 999px;
    border-top-right-radius: 999px;
    border-bottom: none;
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    letter-spacing: .01em;
    line-height: 1;
    font-size: 40px;
    margin: 0 0 6px;
  }
  h1 .full-stop { color: var(--terra); }

  .status-line {
    font-family: 'Work Sans', sans-serif;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 32px;
  }

  .status-line strong { color: var(--ink); font-weight: 500; }

  .refresh {
    display: inline-block;
    margin: 16px 0 40px;
    padding: 12px 22px;
    background: var(--terra);
    color: var(--paper);
    text-decoration: none;
    font-family: 'Work Sans', sans-serif;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    border-radius: 2px;
  }

  .month-label {
    font-family: 'Work Sans', sans-serif;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--olive);
    margin: 40px 0 14px;
    padding-bottom: 8px;
    border-bottom: 1.5px solid var(--sand);
  }

  .booking {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px dotted var(--sand);
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.airbnb { background: var(--terra); }
  .dot.booking { background: var(--olive); }
  .dot.ingo { background: var(--teak); }

  .booking-main { flex: 1; }

  .booking-dates {
    font-size: 17px;
  }

  .booking-source {
    font-family: 'Work Sans', sans-serif;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--faint);
    margin-top: 2px;
  }

  .booking-nights {
    font-family: 'Work Sans', sans-serif;
    font-size: 12px;
    color: var(--faint);
    white-space: nowrap;
  }

  .empty, .error {
    font-style: italic;
    color: var(--faint);
    padding: 20px 0;
  }

  .error { color: var(--terra); font-style: normal; }

  footer {
    margin-top: 60px;
    font-family: 'Work Sans', sans-serif;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
</style>
</head>
<body>
<main>
  <div class="arch-mark"></div>
  <h1>Calendar<span class="full-stop">.</span></h1>
  <p class="status-line" id="status-line">Loading…</p>

  <a class="refresh" id="refresh-link" href="#" target="_blank" rel="noopener">Refresh now on GitHub</a>

  <div id="bookings"></div>

  <footer>Hari Om Niwas — Jodhpur</footer>
</main>

<script>
  // Edit this to your repo's Actions page so "Refresh now" opens the right place.
  const ACTIONS_URL = 'https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME/actions/workflows/sync-calendar.yml';
  document.getElementById('refresh-link').href = ACTIONS_URL;

  const SOURCE_LABELS = { airbnb: 'Airbnb', booking: 'Booking.com', ingo: 'MMT / Goibibo' };

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }

  function monthKey(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  }

  fetch('calendar.json?_=' + Date.now())
    .then((r) => r.json())
    .then((data) => {
      const synced = new Date(data.generatedAt);
      const failed = data.sources.filter((s) => !s.ok);
      let statusText = 'Last synced <strong>' + synced.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</strong>';
      document.getElementById('status-line').innerHTML = statusText;

      if (failed.length) {
        const errDiv = document.createElement('p');
        errDiv.className = 'error';
        errDiv.textContent = failed.map((f) => f.name + ' feed failed — ' + f.error).join(' · ');
        document.getElementById('bookings').appendChild(errDiv);
      }

      const upcoming = data.bookings.filter((b) => new Date(b.end) >= new Date());

      if (!upcoming.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'No upcoming bookings across any platform.';
        document.getElementById('bookings').appendChild(p);
        return;
      }

      let lastMonth = null;
      const container = document.getElementById('bookings');
      upcoming.forEach((b) => {
        const mKey = monthKey(b.start);
        if (mKey !== lastMonth) {
          const label = document.createElement('div');
          label.className = 'month-label';
          label.textContent = mKey;
          container.appendChild(label);
          lastMonth = mKey;
        }
        const row = document.createElement('div');
        row.className = 'booking';
        row.innerHTML =
          '<span class="dot ' + b.source + '"></span>' +
          '<div class="booking-main">' +
            '<div class="booking-dates">' + formatDate(b.start) + ' — ' + formatDate(b.end) + '</div>' +
            '<div class="booking-source">' + (SOURCE_LABELS[b.source] || b.source) + '</div>' +
          '</div>' +
          '<div class="booking-nights">' + (b.nights ? b.nights + (b.nights === 1 ? ' night' : ' nights') : '') + '</div>';
        container.appendChild(row);
      });
    })
    .catch((err) => {
      document.getElementById('status-line').textContent = 'Could not load calendar data.';
      const p = document.createElement('p');
      p.className = 'error';
      p.textContent = err.message;
      document.getElementById('bookings').appendChild(p);
    });
</script>
</body>
</html>
